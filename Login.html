<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="">
  <title>Log in - Aking Forum</title>
  <link rel="icon" href="Screenshot 2026-10-13 192927.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="wrap">
    <h1>Log in</h1>
    <form data-api="/api/login" data-success="index.html">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               maxlength="128" required>
      </div>
      <button type="submit">Log in</button>
      <p class="form-status" role="status"></p>
    </form>
    <p>No account yet? <a href="Registration.html">Create one</a>.</p>
  </main>
  <div id="site-footer"></div>
</body>
</html>
